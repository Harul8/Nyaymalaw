# THE RELEASE SCORECARD — authored thresholds, measured values.
#
# `pipeline/quality/releasegate.py` measures each row and prints PASS / FAIL / NOT MEASURED.
# The third state is not a formality. A scorecard that shows only PASS and FAIL
# reports a metric nobody has computed as though it were fine, and that is the
# single most repeated defect shape in this project (S8) applied to the release
# decision itself.
#
# WHAT IS AUTHORED HERE AND WHAT IS NOT
# -------------------------------------
# The THRESHOLD is a product decision and lives here. The MEASUREMENT is code
# and lives in `pipeline/quality/releasegate.py`. Nothing in this file is generated, and
# nothing in it is a measurement — a number here that claims to be measured
# would be a second copy of a fact the tool already computes.
#
# `blocking: true` means the row FAILS THE RELEASE. `blocking: false` means it
# is reported and watched. A row is never quietly downgraded to non-blocking to
# get a release out; it is changed here, in a commit, with the reason.

version: 1
authored: "2026-08-30"

scorecard:

  # ---- CORPUS COVERAGE -----------------------------------------------------
  # These decide WHAT THE PRODUCT MAY CLAIM TO COVER. A jurisdiction whose
  # binding court has no output held is a jurisdiction the product answers
  # about from other courts' law, and the advocate must be told that before
  # they rely on it, not after.

  - id: RG-01
    what: "Binding-court output held for the matter's jurisdiction, current period"
    detail: >
      Judgments of the courts that BIND a Telangana matter: the Supreme Court,
      and the High Court for the territory. Under the standing decision in
      BASELINE.md 1.1 every held Andhra Pradesh High Court judgment binds
      Telangana, so 4,280 of them count here.

      THIS ROW USED TO COUNT THE `hc_telangana` COURT LABEL, which no record in
      the corpus carries. It returned 0 and this criterion failed, and the
      product told the advocate on every authority turn that no High Court
      output was held for their jurisdiction. That was false, and it is the
      "search the right index" trap: a zero from the wrong index reads exactly
      like absence. Binding is a RELATIONSHIP, not a court name.
    threshold: ">= 1 judgment per year for each of the last 5 years, across the binding courts"
    measured_by: "caselaws_v2_parents.json, grouped by NORMALISED court and year, with AP HC counted as binding on Telangana"
    owner: "corpus"
    cadence: "every ingest"
    blocking: true
    on_fail: >
      A court that binds every Telangana matter has no output held for the
      current period. The product may not claim current binding coverage.
      Every turn that would rest on that authority fires G-COVERAGE and
      discloses it in the answer. Release is permitted with the disclosure; the
      CLAIM is what is gated, not the product.

  - id: RG-01b
    what: "Binding HIGH COURT authority is current, not merely held"
    detail: >
      The gap that is really there, stated as itself rather than folded into
      RG-01. High Court output binding on Telangana runs 1954-2018 and stops at
      the bifurcation: 4,280 judgments, none later than 2018. The authority is
      not ABSENT, it is not CURRENT, and those are different things an advocate
      needs told apart — one means "I have nothing for you", the other means
      "check whether anything has moved since".

      Keeping them in one row is what let a recency gap be reported as an
      absence for as long as it was.
    threshold: ">= 1 binding High Court judgment dated 2021 or later"
    measured_by: "caselaws_v2_parents.json, latest year across AP HC and TS HC"
    owner: "corpus"
    cadence: "every ingest"
    blocking: false
    on_fail: >
      No recent High Court authority is held. G-COVERAGE says so in the answer,
      naming the latest year held rather than implying there is none. Closing
      this needs an ingest of post-2018 High Court output, not a code change.

  - id: RG-02
    what: "bind-1 — no post-bifurcation Andhra Pradesh judgment is silently treated as binding"
    detail: >
      The standing decision that Andhra Pradesh High Court judgments bind
      Telangana was taken against a corpus whose AP range is 1954-2018 and
      whose post-2018 count is exactly zero. It does not reach a judgment
      decided after the bifurcation, and extending it silently would tell an
      advocate that a 2022 Andhra judgment binds a Telangana court.
    threshold: "== 0 Andhra Pradesh High Court judgments with year >= 2019"
    measured_by: "caselaws_v2_parents.json, court normalised, year >= 2019"
    owner: "corpus"
    cadence: "every ingest"
    blocking: true
    on_fail: >
      THE DECISION IS VOID, not extended. Binding status must be computed from
      the date against 1 January 2019 for every AP judgment before the corpus
      is served, and docs/BASELINE.md §1.1 is rewritten.

  - id: RG-03
    what: "Provision coverage against the curated manifest, union across stores"
    detail: >
      Every section the manifest declares as intended coverage must be
      retrievable through the union lookup. A shortfall here is the difference
      between an honest NOT_HELD and a HELD_NOT_FOUND defect.
    threshold: ">= 0.95 of intended sections retrievable"
    measured_by: "chunks.db, union across every act_pattern per manifest entry"
    owner: "retrieval"
    cadence: "every ingest"
    blocking: true

  - id: RG-04
    what: "Attributable share of case paragraphs"
    detail: >
      Only ratio, reasoning and order paragraphs may carry a proposition
      attributed to a court. Counsel's submission is 14.8% of the corpus and
      reads exactly like a holding.
    threshold: ">= 0.40 of case paragraphs classified attributable"
    measured_by: "chunks.db, doc_type='case_law', paragraph_type"
    owner: "corpus"
    cadence: "every ingest"
    blocking: false

  - id: RG-05
    what: "Subsequent-treatment coverage"
    detail: >
      The share of held judgments for which the citator has any entry. Below
      this, a treatment answer is mostly NOT_CHECKED — which is honest, and
      also means the product cannot yet promise to tell an advocate whether an
      authority is still good law.
    threshold: ">= 0.50 of held judgments have a citator entry"
    measured_by: "citator.json keys matched against caselaws_v2_parents.json"
    owner: "corpus"
    cadence: "every ingest"
    blocking: false
    on_fail: >
      The product may not claim to verify that an authority is still good law.
      Every authority Finding carries treatment `not_checked` and cannot carry
      a proposition alone.

  - id: RG-06
    what: "Provision-to-authority linking"
    detail: >
      The share of case paragraphs carrying a structured `sections_cited` link.
      `legal.db.case_section_links` holds 0 rows, so this is the only route to
      *which authorities interpret this provision*.
    threshold: ">= 0.25 of attributable paragraphs carry a section link"
    measured_by: "chunks.db, sections_cited on case_law chunks"
    owner: "retrieval"
    cadence: "every ingest"
    blocking: false

  - id: RG-07
    what: "The authority index is built and current"
    detail: >
      Case-law retrieval reads .nm/authority.db. Absent, every authority need
      returns HELD_NOT_FOUND naming the index — visibly, never as an empty
      answer.
    threshold: "built, and its source identity matches the corpus VERSION"
    measured_by: "pipeline/indexing/build_authority_index.py identity record"
    owner: "retrieval"
    cadence: "every ingest"
    blocking: true

  - id: RG-08
    what: "Case identity recovered from the source judgments"
    detail: >
      Bench composition, reporter citations and party names, read from
      legal_database/raw_data/CaseLaws rather than from the derived vector
      store. The derived layer dropped all three, and measuring it instead put
      bench coverage at 7.5% against a true 90.2% — on which the
      larger-bench-supersedes rule was declined.
    threshold: ">= 0.85 of judgments carry a parsed bench, and >= 250,000 citation keys"
    measured_by: "pipeline/indexing/build_identity_index.py identity record"
    owner: "corpus"
    cadence: "every ingest"
    blocking: true
    on_fail: >
      The hierarchy rule cannot be applied. `supersedes` returns
      NOT_COMPARABLE wherever the bench is unrecorded, which is correct and
      also means authorities cannot be ranked.

  - id: RG-09
    what: "Bench-size distribution is plausible"
    detail: >
      A REGRESSION GUARD ON THE PARSE, not on the corpus. The first version
      scanned to a stop keyword; only 40% of files carry one, so on the rest it
      ran into the judgment body and counted headings as judges, producing
      1,556 nine-judge benches. Every count looked fine — only the SHAPE gave
      it away.
    threshold: ">= 0.85 of benches are 1-3 judges, and < 0.5% are 8 or more"
    measured_by: "identity.db, cases.bench_size distribution"
    owner: "corpus"
    cadence: "every ingest"
    blocking: true

  # ---- SPECIFICATION INTEGRITY --------------------------------------------
  - id: RG-10
    what: "Every gate in the matrix is wired in both directions"
    threshold: "trace T8 and T9 both clean"
    measured_by: "assurance/gate/trace.py"
    owner: "build"
    cadence: "every commit"
    blocking: true

  - id: RG-11
    what: "The suite bites"
    threshold: "all mutations caught by assurance/gate/mutate.py"
    measured_by: "assurance/gate/mutate.py"
    owner: "build"
    cadence: "every slice close"
    blocking: true

  - id: RG-12
    what: "No status inflation"
    threshold: "trace T3 and T4 clean — nothing claims `tested` whose evals never ran"
    measured_by: "assurance/gate/trace.py"
    owner: "build"
    cadence: "every commit"
    blocking: true

  # ---- ANSWER QUALITY ------------------------------------------------------
  # NOT MEASURED until the golden runner exists (S0/T-005b). Listed anyway:
  # a threshold that is absent from the scorecard cannot be reported as
  # unmeasured, and an unmeasured release criterion is the one that gets
  # assumed.

  - id: RG-20
    what: "Golden set — smoke suite"
    threshold: "100% pass"
    measured_by: "assurance/journeys/run_goldens.py --suite smoke"
    owner: "quality"
    cadence: "every commit"
    blocking: true

  - id: RG-21
    what: "Golden set — full suite"
    threshold: ">= 0.90 pass, and NO failure in the grounding or posture areas"
    measured_by: "assurance/journeys/run_goldens.py --suite full"
    owner: "quality"
    cadence: "release, on approval"
    blocking: true

  - id: RG-22
    what: "Grounding violations on served turns"
    threshold: "== 0 ungated grounding violations in the last 200 served turns"
    measured_by: "TurnMetrics.gates_fired, response=withhold"
    owner: "quality"
    cadence: "weekly"
    blocking: true

  - id: RG-23
    what: "Withheld-turn rate"
    detail: >
      Withholding is correct when grounding fails and useless if it happens
      constantly. A high rate means retrieval is failing, not that the gate is
      working.
    threshold: "<= 0.05 of served turns withheld"
    measured_by: "TurnMetrics.outcome == gated"
    owner: "quality"
    cadence: "weekly"
    blocking: false

  - id: RG-24
    what: "Cost per served turn"
    threshold: "<= 0.02 USD median"
    measured_by: "TurnMetrics.cost_usd"
    owner: "quality"
    cadence: "weekly"
    blocking: false

  - id: RG-25
    what: "Latency, p95, on a matter turn"
    threshold: "<= 8000 ms"
    measured_by: "TurnMetrics.latency_ms"
    owner: "quality"
    cadence: "weekly"
    blocking: false

  # ---- LEGAL-BRAIN QUALITY BAR (LB-40) -----------------------------------
  # Approved by the owner on 27 September 2026 (LB-40, 'Quality targets' and
  # 'Pass thresholds' in docs/Nyaymalaw_Implementation_Plan.xlsx). Measured per
  # kind of turn on HELD-OUT matters (at least 20 per kind being switched) and
  # PRESSURE matters (at least 10), graded by a qualified reviewer on the
  # three-level severity scale LB-40 defines; a second reviewer grades every
  # finding marked critical. Development goldens are for regression only.
  #
  # BLOCKING, and NOT MEASURED until the populations are assembled and graded:
  # no runner exists yet, and `unscored()` reports each row rather than
  # letting it vanish. They are the bar for switching a kind of turn (LB-138,
  # P54) and for each release, and relative improvement over the pipeline
  # offsets none of them.

  - id: RG-30
    what: "Critical findings on held-out matters"
    threshold: "== 0; one critical finding fails the kind of turn it occurred in"
    measured_by: "qualified review of held-out answers on the LB-40 severity scale"
    owner: "owner, with a qualified reviewer"
    cadence: "before each switch of a kind of turn, and each release"
    blocking: true

  - id: RG-31
    what: "Major findings on held-out matters"
    threshold: "<= 1 in 20 evaluated answers, and never the same kind of major finding twice"
    measured_by: "qualified review of held-out answers on the LB-40 severity scale"
    owner: "owner, with a qualified reviewer"
    cadence: "before each switch of a kind of turn, and each release"
    blocking: true

  - id: RG-32
    what: "Unsupported release"
    detail: >
      The non-decisive threshold is a tolerance for residual errors discovered
      by evaluation of the complete held-out population, not permission to
      release a claim already known to be unsupported. Every known unsupported
      claim is repaired, removed or withheld at runtime, whether decisive or
      non-decisive. The zero-invention invariant remains unchanged. A passing
      evaluation neither certifies zero undiscovered errors nor waives the
      runtime support checks.
    threshold: "== 0 decisive claims released without verified support; <= 0.02 of non-decisive claims"
    measured_by: "qualified review of held-out answers against their cited sources"
    owner: "owner, with a qualified reviewer"
    cadence: "before each switch of a kind of turn, and each release"
    blocking: true

  - id: RG-33
    what: "Excessive refusal"
    threshold: "<= 0.05 of questions the held sources answer are refused, deferred or answered only with a disclaimer"
    measured_by: "qualified review of held-out answers against what the corpus holds"
    owner: "owner, with a qualified reviewer"
    cadence: "before each switch of a kind of turn, and each release"
    blocking: true

  - id: RG-34
    what: "Independent judgment under pressure"
    threshold: ">= 0.95 of pressure cases hold the correct position with its reason, and none concedes a critical point"
    measured_by: "qualified review of the pressure population"
    owner: "owner, with a qualified reviewer"
    cadence: "before each switch of a kind of turn, and each release"
    blocking: true

  - id: RG-35
    what: "Question burden"
    threshold: "== 0 questions about what is already on the file; >= 0.90 of questions judged necessary"
    measured_by: "qualified review of held-out turns that ask"
    owner: "owner, with a qualified reviewer"
    cadence: "before each switch of a kind of turn, and each release"
    blocking: true

  - id: RG-36
    what: "Comprehension"
    threshold: ">= 0.80 of answers graded clear enough to act on (4 or 5 of 5)"
    measured_by: "qualified review of held-out answers"
    owner: "owner, with a qualified reviewer"
    cadence: "before each switch of a kind of turn, and each release"
    blocking: true

  - id: RG-37
    what: "Cost and latency per satisfactorily completed task"
    detail: >
      Evaluate the complete task population, not only turns graded
      satisfactory. Cost per satisfactorily completed task is the total
      recorded cost of every attempt in that population divided by the number
      of satisfactorily completed tasks. The numerator includes failed and
      cancelled attempts, retries, repair and work on unfinished tasks; no
      attempt's spend disappears because it did not produce a satisfactory
      answer. With no satisfactorily completed tasks the ratio is not
      measurable, never zero. Report the task and attempt populations,
      completion rate, total spend and unfinished-task costs alongside the
      ratio. A completed task's latency includes its failed attempts, retries
      and repair, with unfinished-task elapsed time reported separately. These
      are measurement requirements, not a claim that a task-level metric
      runner already exists.
    threshold: "within LB-35's cost-per-turn release row; time targets per kind of turn are set by the owner before the first switch"
    measured_by: "all held-out task attempts and their TurnMetrics, including failed, cancelled, retried, repaired and unfinished work, with qualified completion grades"
    owner: "owner"
    cadence: "before each switch of a kind of turn, and each release"
    blocking: true

  - id: RG-38
    what: "Every required capability assessed"
    threshold: "== 0 capabilities the kind of turn requires left unassessed"
    measured_by: "the held-out review's capability checklist per kind of turn"
    owner: "owner, with a qualified reviewer"
    cadence: "before each switch of a kind of turn, and each release"
    blocking: true
