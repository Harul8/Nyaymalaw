[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyaymalaw"
version = "0.0.1"
description = "An expert advocate, for practising advocates in India"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "cryptography>=43.0",
]

[project.optional-dependencies]
# The model adapters. Deliberately optional and per-provider: nothing in
# backend/nm/core may import any of these, and layercheck fails the build if it does.
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
knowledge = ["openpyxl>=3.1"]
dev = [
    "jsonschema>=4.26,<5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pylint>=3.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
]
# BK-30's browser half, and it is separate from `dev` on purpose.
#
# The journey harness runs the PAGE: responsive navigation at three widths,
# keyboard-only movement, reload and draft recovery, and a logout the server
# refuses. None of that is reachable from `TestClient` --
# `tests/test_the_page_and_the_script_agree.py` says in as many words that it
# does not run the page, and that is where the measured defects lived.
#
# IT IS ITS OWN EXTRA BECAUSE IT SHIPS A BROWSER BINARY. `pip install -e
# .[dev]` must stay a fast, offline-able step; a contributor who wants the
# journey suite asks for it, and the suite says so by name when the import
# is missing rather than skipping quietly.
journey = ["playwright>=1.47", "pytest-playwright>=0.5"]
# THE EVAL TOOLS, chosen 15 September 2026 (Implementation Plan, Eval columns).
#
# `bdd` turns a plan row's Must do / Must never into Given-When-Then tests and
# installs into the project environment: it adds four small packages and moves
# nothing the product depends on.
#
# `inspect` (scored conversations with a full per-sample log), `ragas`
# (retrieval) and `annotation` (Label Studio for advocates grading answers) are
# INSTALLED INTO THEIR OWN ENVIRONMENTS, never the product's: beside the product
# they upgrade pydantic, anyio, requests and others the served application
# relies on. And not into ONE shared environment either, measured on install:
# Inspect's OpenAI provider requires openai>=3.1 while Ragas's langchain-openai
# requires openai<3. Ragas 0.4.3 also imports a module langchain-community 0.4
# removed, so its langchain set is pinned below 1.0.
#   python -m venv --system-site-packages %USERPROFILE%\.venvs\nyaymalaw-inspect
#   python -m venv --system-site-packages %USERPROFILE%\.venvs\nyaymalaw-ragas
#   python -m venv %USERPROFILE%\.venvs\label-studio
bdd = ["pytest-bdd>=8.1,<9"]
inspect = ["inspect-ai==0.3.263", "openai>=3.1,<4"]
ragas = [
    "ragas==0.4.3",
    "langchain<1",
    "langchain-core<1",
    "langchain-community<0.4",
    "langchain-openai<1",
    "openai>=1.104,<3",
    "jiter<0.15",
]
annotation = ["label-studio==1.23.0"]

[tool.hatch.build.targets.wheel]
packages = ["backend/nm"]

[tool.pytest.ini_options]
# The backend package lives under backend/; the assurance, pipeline and
# development tooling are imported from the repository root.
pythonpath = [".", "backend"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "class_a: no corpus, no model. Runs every commit, in seconds.",
    "class_b: needs an answer to inspect. Asserted at runtime on every served turn.",
    "class_c: needs the corpus. Runs on every ingest or index change.",
    "class_d: needs a rubric and a judge model. APPROVED RUNS ONLY.",
    # BK-30. Not a fifth class of eval -- it is the SAME product driven
    # through the surface an advocate actually touches, and it is marked
    # separately only because it starts a browser and cannot run in the
    # every-commit cadence.
    "journey: drives the real page in a browser. Needs `.[journey]`.",
    # BK-83. NEEDS A REAL POSTGRESQL SERVER, named by NM_POSTGRES_DSN and
    # owned by whoever runs it. Marked separately because it cannot run in the
    # every-commit cadence and because a SKIP here is NOT a pass: a control in
    # the Class-A tier refuses any BK-83-AC1 evidence claim while no run of
    # this marker has been recorded.
    "postgres: needs a disposable PostgreSQL instance. NM_POSTGRES_DSN.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# THE LINT POPULATION DID NOT CHANGE WITH THE LAYOUT. Before 14 September 2026
# the gate linted nm/, tools/ and tests/; the specification generators under
# spec/ were never in it. They now live in assurance/specification/, beside
# tooling that IS linted, so they are excluded here by name rather than being
# silently added to -- or silently dropped from -- the population.
extend-exclude = ["assurance/specification"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
# N818 wants every exception to end in "Error". Ours are named for WHAT
# HAPPENED -- StaleWrite, TurnRefused, ContextOverflow, ContentRefused -- and
# they read better at the call site than StaleWriteError would. The names are
# deliberate, so the rule is disabled with a reason rather than worked around.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Hand-verified regex tables. Reflowing a regex is a change that fails
# SILENTLY, and this project has already lost time to exactly that.
"development_environment/one_off_tools/find_goldens2.py" = ["E501"]
"pipeline/quality/verify_set.py" = ["E501"]

[tool.pylint.messages_control]
# The rename sweep. pyflakes does not find these, and a stale call site after a
# rename raised NameError on every matter for weeks in the previous build.
disable = "all"
enable = "E0601,E0606,E1101"
