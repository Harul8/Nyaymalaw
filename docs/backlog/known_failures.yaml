    worth recording that it was NOT in the reported baseline of three failures:
    that baseline came from running trace and pytest directly rather than the
    whole gate, so a fourth red step went unseen. A baseline measured on part
    of a population is a baseline about that part.

# ---------------------------------------------------------------------------
# THE SAVED WORKBOOK IS BEHIND THE REGISTRY, 13 September 2026 (BK-80-AC7).
#
# `docs/Nyaymalaw_End_to_End_Project_Plan.xlsx` is a DERIVED reader view. This
# branch's delivery records moved its sources -- P21/P22/P23/P47/P46/P24 events,
# including BK-25 planned -> in_progress -- so the view no longer reconciles to
# them and `tools/plan_view.check_view` says so, correctly, twenty-one times.
#
# THE SOURCES ARE CURRENT AND THE VIEW IS STALE. That is the direction that
# matters: no registry claim rests on the workbook, and CLAUDE.md already says
# the generated views "reconcile to these files; they do not override them".
# Nothing about the product's behaviour is unverified by these twenty-one.
#
# WHY IT WAS NOT SIMPLY REGENERATED. The view's owner is
# `spec/plan/build_current_plan.mjs`, which resolves `@oai/artifact-tool`.
# Measured on this machine: Node is present at C:\Program Files\nodejs, and
# the package is absent from the repository, from this worktree, from the npm
# global root and from anywhere under the user profile. It is an internal
# `@oai`-scoped package, so the public registry cannot supply it either.
#
# AND NOT PATCHED IN PLACE EITHER, which was measured rather than assumed:
# `plan_view.load_view` reads the workbook with `data_only=True`, i.e. the
# CACHED results of its formulas, and the saved view carries 88 of them.
# openpyxl does not evaluate formulas, so a load-and-save writes all 88 back
# with no cached value and every one would then read as `None`. A refresh that
# way would break more of the view than it fixed -- and would make a second
# writer of a derived artefact, which is the defect §4 exists to refuse.
#
# THE EIGHTEEN PARAMETRISED ROWS ARE NEGATIVE CONTROLS, and their failure mode
# is worth naming. Each plants ONE mutation into a copy of the saved view and
# asserts the checker reports exactly that mutation. The checker now reports
# the planted mutation AND the pre-existing staleness, so the exact-match
# assertion fails. They are not broken controls; they are correct controls
# reading a view that is already wrong, and they will pass again the moment
# the workbook is regenerated -- at which point this whole block must SHRINK,
# which the registry's third outcome enforces.
#
# OWNED BY the three criteria that each claim the workbook reconciles to its
# sources: BK-87-AC4, BK-89-AC4 and BK-90-AC3. All three are unproven while
# the view is behind, and saying so is the point of naming an owner.
# ---------------------------------------------------------------------------

