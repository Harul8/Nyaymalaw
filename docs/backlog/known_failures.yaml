    explicit strict=. No product code is affected and no rule was relaxed to
    accommodate them -- ruff still runs with the same configuration.

    The fact binds both the count and the digest of every path, position, rule
    and reason in the 144-diagnostic set measured during P03. Fixing, adding or
    replacing even one diagnostic changes it and blocks; the declaration cannot
    absorb a new finding merely because another was fixed at the same time.

