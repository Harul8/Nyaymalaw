    THE STRUCTURED REASON CARRIES THE EXACT COUNT, on the same rule as
    RUFF-PLANNING-DEBT: a new module claiming a feature, or a row gaining
    `delivers:`, moves the number and blocks until somebody re-registers it.

- id: TRACE-T3C
