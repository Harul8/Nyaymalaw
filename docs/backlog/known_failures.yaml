# THE FAILURES THIS BUILD ALREADY KNOWS ABOUT, EACH WITH AN OWNER.
#
# WHY THIS EXISTS, 10 September 2026
# ------------------------------------
# This baseline once recorded trace and style failures. The rows below must
# shrink when remeasurement proves a repair. Tests of trace mechanics plant
# their own independent failures; they do not need a live defect to exercise
# the control.
#
# REMEASURED 13 September 2026 on the integrated P18-P24/P46/P47 and open-email
# registration candidate: trace reports 0 failures. P24 supplies C1's fifth
# witness, so TRACE-C1 is repaired and removed rather than waived. The empty
# list is deliberate: any current failure is new and blocks.
#
# But `tools/check.py` returns 1 on any failure, writes no stamp, and
# `tools/hooks/pre-commit` then refuses every commit. So the repository was in
# a state where honest, owned red obligations blocked ALL further work --
# including the work that would eventually close them. The only ways out were
# to bypass the hook, to weaken the failing tests, or to stop committing. Each
# of those is worse than the problem.
#
# THE THIRD OPTION IS TO SAY WHICH FAILURES ARE ALREADY KNOWN, WHO OWNS THEM,
# AND TO BLOCK ON ANY OTHER. That is this file. It does not make anything pass:
# `tools/check.py` still prints FULL GATE RED, the stamp it writes is marked
# `scoped`, and no acceptance criterion can derive `done` from a scoped run.
#
# WHAT MAKES IT A CONTROL RATHER THAN A WAIVER
# ----------------------------------------------
# Three outcomes, not two:
#
#   actual == declared   -> SCOPED BUILD PASS, commit permitted, full gate red
#   actual  > declared   -> BLOCKED. A new failure is not covered by this file.
#   actual  < declared   -> BLOCKED. A declared failure that has started
#                           passing means this file is stale and must SHRINK.
#
# The third is the one that keeps it honest. Without it a waiver outlives the
# defect it was written for and quietly covers the next one that lands on the
# same test -- which is exactly what `pytest.xfail` non-strict does, and this
# repository already refuses that in
# `tests/test_a_documented_defect_uses_a_strict_marker.py`. Same rule, one
# level up: a documented failure that stops failing is a finding, not a relief.
#
# EVERY ROW NAMES AN ACCEPTANCE CRITERION. A failure with no owner is not
# known, it is forgotten, and the linter refuses a row without one.
#
# FACTS ARE STRUCTURED AND EXACT, NOT PREFIXES. A pytest node is inseparable
# from its outcome, reason and aggregate subfailures; a tool diagnostic set is
# inseparable from its exact digest. The gate blocks on any change.

