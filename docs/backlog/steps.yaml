  items:
  - BK-8
- id: STEP-B-02
  name: Emergency triage, before any screen can delay it
  phase: B
  basis: prd_sequence
  features:
  - B2
  items:
  - BK-34
  - BK-53
  actor: advocate
  entry_conditions:
  - authenticated
  - an opening message is routed as a matter
  user_action:
  - describes a situation in which liberty or an irreversible deadline is in play
  expected_visible_result:
  - the emergency is named back, and the protective or referral step is given before any
    screen is asked to clear
  expected_domain_effect:
  - the emergency is DECLARED on the matter with who invoked it and why; screens remain
    outstanding and are recorded as outstanding
  failure_behaviour:
  - if the emergency cannot be established, the ordinary screen order resumes and nothing
    substantive is admitted
  recovery_behaviour:
  - the declaration survives reload and is visible in the record
  exit_conditions:
  - either a recorded emergency exception, or no emergency and the conflict screen is next
  notes: 'Tenet 6 is prior to tenet 3: an advocate whose client is being arrested tonight
    is not told to wait for a conflict check. The precedence covers protective and referral
    steps only and is not a substantive-advice bypass.'
- id: STEP-B-03
  name: The conflict screen
  phase: B
  basis: prd_sequence
  features:
  - B3
  items:
  - BK-34
  actor: advocate
  entry_conditions:
  - no emergency exception, or one recorded
  - at least one party named
  user_action:
  - names the client and the party against
  expected_visible_result:
  - the conflict state is shown as clear, blocked, incomplete or NOT ASSESSED, and says
    WHICH files were checked
  expected_domain_effect:
  - the screen decision is persisted with the parties it covers
  failure_behaviour:
  - an unreadable file makes the screen INCOMPLETE, never clear
  - no party named makes it NOT ASSESSED, never clear
  recovery_behaviour:
  - the decision is re-derived when a party is added, and the earlier clearance goes stale
  exit_conditions:
  - conflict resolved or expressly excepted
  notes: The scope is the advocate's own files and the wording says so; it is not a firm-wide
    registry check. Adding a party must stale an earlier clearance -- BK-34, and it does
    not today.
