- id: STEP-D-03
  name: Compute the limitation period
  phase: D
  basis: prd_sequence
  features:
  - D2
  items:
  - BK-35
  actor: system
  entry_conditions:
  - posture resolved
  - a cause of action settled
  - at least one dated event on the thread
  user_action:
  - asks for the position, or supplies a date
  expected_visible_result:
  - the period, the Article it came from, the date it runs from and the limb -- or a named
    refusal saying what is missing
  expected_domain_effect:
  - the computed expiry is persisted against the thread and feeds the deadline register
  failure_behaviour:
  - no Article retrieved, no dated event, or a trigger that cannot be identified among the
    dated entries, each refuse SEPARATELY and by name; none of them falls back to the earliest
    date
  recovery_behaviour:
  - supplying the missing date re-derives everything resting on it
  exit_conditions:
  - limitation computed, or not_computed with the reason visible to the advocate
  notes: 'A blocking gate: no merits work on a thread whose limitation is not computed.
    BK-35 -- a single dated fact that does not satisfy the curated trigger is still run
    from, which is the fallback this step forbids.'
