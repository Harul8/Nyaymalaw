- id: BK-21
  title: the matter encryption key IS the OpenAI API key
  kind: substrate
  priority: P0
  delivery_status: verifying
  implementation: complete
  verification: passing
  affects_phases: [A, C, I]
  record: docs/BACKLOG.md#bk-21-the-matter-encryption-key-is-the-openai-api-key
  next_action: closed on a measured rotation and signed off 10 September 2026; the
    lifecycle was recorded retrospectively because the row was built before BK-74
  stage_records:
    start: {result: READY, ref: docs/BACKLOG.md#bk-21-the-matter-encryption-key-is-the-openai-api-key}
    build: {result: BUILT, ref: docs/BACKLOG.md#bk-21-the-matter-encryption-key-is-the-openai-api-key}
    test: {result: VERIFIED, ref: docs/backlog/evidence/class_a.json}
    signoff: {result: SIGNED_OFF, ref: docs/BACKLOG.md#bk-21-the-matter-encryption-key-is-the-openai-api-key}
  acceptance:
  - id: BK-21-AC1
    requirement: the seal is refused when it equals ANY other credential in the environment,
      not only the one that collided
    required_evidence: [domain_test]
    evidence:
      domain_test:
        result: PASS
        ref: tests/test_the_seal_is_not_another_credential.py::test_the_seal_may_not_be_any_other_credential
    negative_control:
      mutation: set a seal that shares its value with no other credential
      expected_failure: the guard must NOT fire; a guard that refuses a correct
        configuration stops the product at start-up and gets suppressed
  - id: BK-21-AC2
    requirement: the re-key tool separates sealed, deliberately open and unreadable,
      and refuses the run rather than skipping a file it cannot open
    required_evidence: [domain_test]
    evidence:
      domain_test:
        result: PASS
        ref: tests/test_the_seal_is_not_another_credential.py::test_the_rekey_tool_tells_sealed_from_open_from_unreadable
    negative_control:
      mutation: hand it a file sealed under a different key
      expected_failure: classified UNREADABLE and the run stops; classifying it as
        open would silently drop a matter nothing can read afterwards
  - id: BK-21-AC3
    requirement: the seal on this machine shares its value with nothing
    required_evidence: [domain_test]
    evidence:
      domain_test:
        result: PASS
        ref: tests/test_the_seal_is_not_another_credential.py::test_the_real_environment_does_not_share_its_seal
        note: 247 sealed files re-keyed 9 September 2026 and verified with the new
          key; the application composes and opens real matters
    negative_control:
      mutation: restore the previous .env, where NM_MATTER_KEY equalled NM_MODEL_API_KEY
      expected_failure: composition refuses to start
  - id: BK-21-AC4
    requirement: the provider credential that was shared is itself rotated at the provider
    required_evidence: [production_measure]
    evidence:
      production_measure:
        result: PASS
        ref: docs/backlog/evidence/BK-21-AC4.json
        note: 'ROTATED AND VERIFIED. Measured rather than taken on trust: the previous
          value now returns HTTP 401 token_invalidated from the provider, so the
          credential exposed on 7 September is dead; the value now in .env returns
          HTTP 200 and tests/test_openai_live.py passes end to end through the
          adapter. It does not collide with the matter seal, so BK-21''s guard holds
          across the rotation -- which is the point: the same rotation would have
          destroyed all 247 sealed matters the day before.'
    negative_control:
      mutation: rotate the provider credential before re-keying
      expected_failure: every stored matter becomes permanently unreadable -- the
        destructive order this row exists to prevent

