# THE CORPUS MANIFEST — curated, not derived. PRD §4.5 / D5A.
#
# This file asserts INTENDED coverage. It is written by hand and is NOT
# generated from the index, because an index can only report what is present
# and never what is missing. The difference between `intended_sections` here
# and what the corpus actually returns IS the ingestion backlog, and it is what
# makes HELD_NOT_FOUND distinguishable from NOT_HELD.
#
# `act_patterns` lists EVERY identifier convention the Act is held under. The
# corpus holds the same Act under two, at different degrees of completeness --
# the Specific Relief Act has 13 sections under one and all 44 under the other.
# Coverage is the UNION across them (check `act-1`); a figure from one store is
# refused, not reported.

corpus_version: "vector_store@2026-08-29"
reconciled_at: "2026-08-29"

acts:
  - act_name: "Specific Relief Act, 1963"
    act_patterns: ["%SPECIFIC RELIEF ACT, 1963%", "the_specific_relief_act_1963"]
    intended_sections: ["1-44"]
    keywords: ["specific relief", "specific performance", "dispossessed", "possession", "injunction", "declaration"]

  - act_name: "Limitation Act, 1963"
    act_patterns: ["the_limitation_act_1963", "%LIMITATION ACT, 1963%"]
