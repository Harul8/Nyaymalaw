- id: B2
  title: Emergency triage
  phase: B
  slice: S10
  status: decided
  does:
  - 'Screen every applicable urgency class, **every turn**: limitation and filing dates; hearings and
    orders; arrest or liberty risk; personal safety; child safety; injunction or status-quo need; asset
    dissipation; evidence destruction; service deadlines; any step whose delay is irreversible.'
  - A live emergency **leads** the answer, with the action, the owner and the time.
  - With several urgencies, the nearest window leads and the rest stay visible.
  - Where nothing is urgent, say so — **cleared, not silent**.
  - Where the advocate resolves one, record who resolved it and how, and do not re-raise it.
  never:
  - Never report a class that was **not assessed** as cleared. If the screen could not run, say that,
    and the turn does not proceed as though it cleared.
  - Never let an emergency raised on turn 1 disappear by turn 9. Silence never clears an urgency.
  - Never let a later "no" silently close a live emergency — a resolution needs a named resolver and a
    recorded basis.
  - Never flag every class on every matter. A screen that raises five of eleven on an ordinary file has
    stopped being a signal.
  produces:
  - '`UrgencyRegister { class, state ∈ {live, cleared, not_assessed, resolved}, raised_at, resolver, action,
    owner, due }` — persisted, carried across turns, and re-evaluated rather than re-created.'
  eval_prose:
  - '**Class A** — an urgency raised at turn 1 is present at turn 9 unless a named resolver closed it.
    A `not_assessed` class never renders as cleared.'
  - '**Class B** — a live emergency is the first content element of the answer, and is never inside collapsed
    content.'
  - '**Class C** — flag rate per matter is measured; a persistent multi-class flag rate is a calibration
    defect.'
  eval_ids:
  - E-103
  - E-104
  - E-105
  counterexample: A matter where the urgency step threw an exception and the answer reads "nothing urgent
