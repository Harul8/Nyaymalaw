- id: B3
  title: Conflict screen
  phase: B
  slice: S10
  status: decided
  does:
  - Take **names only** and screen against the firm-wide registry before any substance is retained.
  - 'Where substance arrives before clearance: think, answer within the permitted pre-clearance scope,
    and **retain nothing** — quarantine it.'
  - 'On a match: block, name the matches reviewed, route to a named human.'
  - 'On human clearance: record who cleared it, when, and against what; release the quarantine **exactly
    once**.'
  - 'On refusal: record the return or destruction of what was received.'
  never:
  - '**Never let an incomplete screen clear a matter.** A registry that was unreadable in part produces
    an incomplete screen, and an incomplete screen never clears.'
  - Never treat an empty registry as a pass. Say the registry was empty — a gate that has never refused
    is not evidence.
  - Never let one unreadable matter take the screen down for every other matter.
  - Never count the matter under screen against itself as a match.
  produces:
  - '`ConflictScreen { state ∈ {clear, matched, incomplete, not_run}, parties_screened[], matches[], cleared_by,
    cleared_at, party_set_hash }`. The `party_set_hash` is what tenet 30 re-checks against.'
  eval_prose:
  - '**Class A** — an `incomplete` screen cannot transition to `clear` without a re-run. A clearance is
    bound to the party set that was screened.'
  - '**Class B** — no substantive fact is persisted to a matter whose screen is not `clear` or expressly
    emergency-excepted.'
  eval_ids:
  - E-106
  - E-107
  counterexample: A registry read that failed on three of forty firms and returned "no conflicts found".
  tasks: []
- id: B4
  title: Competence screen
  phase: B
  slice: S10
  status: decided
  does:
  - 'Record a competence assessment on the matter: jurisdiction, practice area, language, and known corpus
    coverage for what the matter needs.'
  - 'Outside jurisdiction: block, name the limit, refer.'
  - 'Governing record in another language: record a translation requirement, **moved to an owner, never
    deleted**.'
  - Where corpus coverage for the governing law is partial, report **partial coverage**, not "within competence".
  - Where specialist or local counsel is needed, name the need and its owner.
  never:
  - Never recompute the assessment from the latest message. **It lives on the matter and it is sticky.**
    A matter-level screen that re-derives itself from the current turn forgets what it found.
  - Never let a human release erase the finding. A released limit stays visible with who released it and
    why.
  - Never over-apply the language limit so that matters NM can advise on are blocked because a document
    contains a non-English phrase.
  produces:
  - '`CompetenceAssessment { jurisdiction_ok, area, language_requirements[], coverage_state, gaps[{need,
    owner}], released_by }` — matter-scoped and sticky.'
  eval_prose:
  - '**Class A** — the assessment persists across turns and is not a function of the latest message. A
    release records rather than deletes.'
  - '**Class C** — declared competence is derived from the corpus manifest, never from a hardcoded constant.'
  eval_ids:
  - E-108
  - E-109
  counterexample: A competence limit found at turn 2, released by a partner at turn 3, and absent from
