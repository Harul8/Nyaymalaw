- id: B5
  title: Engagement, authority and scope
  phase: B
  slice: S10
  status: decided
  does:
  - Record who the client is, who may instruct, who decides, the scope and its exclusions, confidentiality,
    communications, fees and likely disbursements, document custody, termination rights and the complaints
    route.
  - Distinguish the client from an intermediary, a payer, a family member, an authorised representative
    or the instructing advocate.
  - Where nothing is recorded, advice may be discussed **provisionally** and is not reliance-ready.
  - Work inside recorded scope; anything outside is visibly blocked or expressly accepted.
  never:
  - Never treat an intermediary, payer or family member as the client.
  - Never let a blank scope line put every step in scope. An unrecorded scope is `unknown`, and `unknown`
    does not authorise.
  - Never mark advice ready for reliance while identity, authority, scope or decision ownership is unrecorded.
  - Never do work outside scope silently.
  produces:
  - '`Engagement` — **the full contract is Appendix E.** `reliance_ready: bool` is replaced by a three-state
    `reliance`, because a boolean cannot distinguish *we checked and it is not ready* from *nobody looked*;
    and the contract now carries `intermediary`, `payer`, `scope_exceptions`, fees, disbursements, custody,
    termination and the complaints route, each of which B5 requires and none of which the old shape could
    hold.'
  eval_prose:
  - '**Class A** — `reliance_ready` is false while any of identity, authority, scope or decision ownership
    is unset. An empty scope authorises nothing.'
  - '**Class B** — every served answer states whether it is provisional or reliance-ready.'
  eval_ids:
  - E-110
  - E-111
  counterexample: A file with a blank scope where every recommended step rendered as in-scope.
  tasks: []
- id: B6
  title: Capacity to instruct  ⟨tenet 32⟩
  phase: B
  slice: S10
  status: decided
  does:
  - 'Record a capacity position on any decision that becomes authority: assessed, not assessed, or in
    doubt.'
  - Where the material suggests the client may lack capacity to give the instruction being acted on, surface
    it and hold the instruction short of authority until a human resolves it.
  - Keep vulnerability and capacity as **separate findings** — vulnerability changes how NM communicates;
    incapacity changes whether an instruction is authority at all.
  never:
  - Never infer incapacity from vulnerability, age, distress or an unusual instruction. NM has not met
    the client and holds no material on which a capacity finding could rest — it raises the question,
    it does not answer it.
  - Never let `not assessed` render as `assessed`.
  produces:
  - '`CapacityPosition { state, basis, raised_at, resolved_by }` on each `DecisionRecord`.'
  eval_prose:
  - '**Class A** — an instruction whose capacity position is `in_doubt` cannot mark advice reliance-ready.'
  - '**Class D** — the raising language is a question about the record, never a characterisation of the
    person.'
  eval_ids:
  - E-112
  - E-113
  counterexample: A file where a recorded vulnerability silently downgraded the client's instructions.
  tasks: []
- id: C1
  title: The account
  phase: C
  slice: S1
  status: tested
  does:
  - Take an uninterrupted account whole before clarifying anything.
  - 'Then clarify: who, what, when, where, how, why. **Open questions before narrow ones.**'
  - Label the basis of every material proposition — direct knowledge, document, hearsay, inference, or
    belief.
  - Explore unfavourable facts as hard as favourable ones.
  - Summarise back and invite correction; accept the correction.
  never:
  - Never resolve a contradiction inside the account silently. **Keep both.**
  - Never lead. "Is there anything evidencing repayment?" — not "I take it there is no proof of repayment?"
    A leading question shapes what comes back and can manufacture the gap it assumed.
  - Never record a paraphrase as a quotation. A recorded "exact words" must be findable in the account
    it claims to come from.
  - Never record a source for a basis that points nowhere.
  produces:
  - '`Fact` — **the full contract is Appendix E.** The fields the four-field summary used to list could
    not carry C1: no `exact_words`, so *never record a paraphrase as a quotation* was unenforceable; no
    `basis_source`, so *never record a source that points nowhere* had nothing to check; and no `weight`,
    so *explore unfavourable facts as hard as favourable ones* left no trace that it had happened.'
  eval_prose:
  - '**Class A** — every Fact carries provenance; a Fact without it cannot be constructed. A quoted verbatim
    string is present in its cited source.'
  - '**Class B** — contradictions render as conflicts, never as a resolved value.'
  - '**Class D** — questions are open before narrow.'
  eval_ids:
  - E-012
  - E-036
  counterexample: 'A recorded "the client said: I never signed it" where the account contains no such
    sentence.'
  tasks: []
- id: C2
  title: Objectives and constraints
  phase: C
  slice: S7
  status: decided
  does:
  - Record the legal result sought **and the real practical objective behind it**.
  - Record each stated constraint — cost, time, cash flow, publicity, relationships, safety, risk appetite,
    business continuity, enforceability — **in the words it rests on**.
  - Where constraints conflict with the aim, name the trade-off.
  - Revisit when circumstances change.
  never:
  - '**Never invent a constraint the client did not express**, and never invent a threshold. Where no
    constraints were stated, record none.'
  - Never mark an ordinary commercial preference as absolute. An "absolute" limit vetoes a course; that
    label must come from the client's own words.
  - Never answer "what would breach this limit" with the consequence of breaching it.
  produces:
  - '`Constraint { kind, statement, verbatim_source, absolute: bool, breach_condition }`.'
  eval_prose:
  - '**Class A** — every Constraint carries a verbatim source drawn from the transcript. A Constraint
    with no source cannot be constructed.'
  - '**Class B** — every recommendation names the objective it serves and its compatibility with recorded
    constraints.'
  eval_ids:
  - E-070
  counterexample: A file where "we would rather not go to trial" was recorded as an absolute bar on litigation.
  tasks: []
- id: C3
  title: Parties and posture
  phase: C
  slice: S3
  status: tested
  does:
  - For every thread establish who the parties are and which side the client is on, **before resolving
    any provision**.
  - 'Hold `role` (the forum-correct name) and derive `side` ∈ {moving, defending} from it. The test: **whoever
    must file to get what they want is the mover.**'
  - Show `basis` — stated, inferred or unknown.
  - 'Enrichment is monotonic: gaps fill freely, `inferred` upgrades to `stated` freely.'
  never:
  - '**Never default to "our client is the aggrieved party".** `unknown` is a first-class value that blocks
    the directive step for that thread and makes NM ask.'
  - '**Never infer the side from familiar vocabulary.** "The landlord issued a quit notice" does not tell
    you which side the client is on.'
  - Never silently flip a `stated` posture. A contradiction surfaces as a conflict for the advocate to
    settle — a turn-5 reversal is worse than a turn-1 error, because by then the advocate has acted.
  - Never store `side` independently of `role`. It is a derived value.
  produces:
  - '`Posture { role, side (derived), opponent, opponent_role, proceeding, stage, basis, source_fact,
    conflicts[] }` with a version stamp that downstream derivations record against.'
  eval_prose:
  - '**Class A** — `unknown` posture blocks directive advice for that thread. `side` is asserted as a
    pure function of `role`. A posture conflict does not overwrite.'
  - '**Class B** — the parties table renders on every multi-thread answer, and unresolved sides render
    loudly.'
  eval_ids:
  - E-030
  - E-031
  - E-035
  counterexample: 'The measured original defect: a client prosecuted under s.138 advised to file the prosecution,
    and an employer told he could claim reinstatement from himself. Every citation correct, every inference
    sound, the whole thing on the wrong side.'
  tasks:
  - T-030
- id: C4
  title: Thread identity
  phase: C
  slice: S3
  status: tested
  does:
  - Give every thread a **stable id, generated once and never derived from its label**. The label is a
    display name and may change freely.
  - Carry labels as **aliases** — the advocate's phrasing, each document's phrasing, the cause number.
  - 'Resolve identity on the facts that constitute the matter: parties, proceeding, forum, and any decisive
    identifier (case number, FIR number, cheque number, survey number, registration number).'
  - Bind every uploaded document to a thread, and show the binding so it can be corrected.
  never:
  - '**Never merge on label similarity alone.** Ranked: a decisive identifier settles it; parties plus
    proceeding plus forum is strong; label similarity is never sufficient.'
  - Never merge silently. Wrongly splitting costs duplicated analysis — visible and recoverable. **Wrongly
    merging attaches the wrong posture, limitation and provisions to facts they do not govern — invisible,
    and it inverts the advice.** The default is to keep separate.
  - Never let an unattached document contribute facts, and never default it to the first or largest thread.
  produces:
  - '`Thread { id, label, aliases[], identifiers{}, posture, chronology[], issues[], deferred }`.'
  eval_prose:
  - '**Class A** — a thread id survives a rename with everything attached. Label similarity alone never
    merges. **Two different matters between the same parties do not merge** — a recovery suit and an eviction
    between the same landlord and tenant are two threads.'
  - '**Class B** — every merge is reported with the identifier that justified it.'
  eval_ids:
  - E-032
  - E-033
  counterexample: A sale deed saying "the Kukatpally property", a note saying "the land matter" and a
    plaint saying "O.S. 442/2023" merged into one thread on textual similarity, or split into three.
