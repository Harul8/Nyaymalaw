# GENERATED by tools/export_spec.py -- do not edit.
# Source: spec/prd/schemas.js (Appendix E). PRODUCES clauses are checked
# against these by tools/speccheck.py, and the code's own dataclasses are
# checked against them by tests/test_produces_contracts.py.

schemas:
- name: Fact
  owner: C1
  purpose: A single proposition from the account, with everything needed to walk it back.
  fields:
  - field: id
    type: FactId
    required: true
    why: Stable across corrections. A fact whose id changes cannot be superseded, only duplicated.
  - field: statement
    type: string
    required: true
    why: What was said, in the account's own terms.
  - field: exact_words
    type: string|null
    required: false
    why: '**The quotation, if one was recorded.** C1 forbids recording a paraphrase as a quotation, and
      that rule is unenforceable unless the claimed exact words are a separate field that can be checked
      back against the account.'
  - field: basis
    type: enum {direct_knowledge, document, hearsay, inference, belief}
    required: true
    why: C1 requires the basis of every material proposition to be labelled. Without the field the labelling
      is a habit, and habits do not survive a busy turn.
  - field: basis_source
    type: string|null
    required: true
    why: Where the basis points — the document, the person, the inference's inputs. C1 forbids a source
      that points nowhere; `null` is permitted only where basis is `direct_knowledge` or `belief`.
  - field: date
    type: date|null
    required: true
    why: '`null` means UNDATED. It is never an estimate, and never today.'
  - field: certainty
    type: enum {documented, asserted}
    required: true
    why: An assertion and a document are different evidential positions and must not merge on the board.
  - field: provenance
    type: Provenance
    required: true
    why: Non-optional by construction. An advocate who cannot audit the chain has to take the answer on
      trust.
  - field: material
    type: bool
    required: true
    why: Materiality drives what is confirmed and what is pleaded.
  - field: weight
    type: enum {favourable, unfavourable, neutral, not_assessed}
    required: true
    why: '**C1 requires unfavourable facts to be explored as hard as favourable ones.** With no field,
      nothing can check that they were — and the adverse-fact accounting in D6 has nothing to compare
      against.'
  - field: confirmed
    type: bool|null
    required: true
    why: '`null` is NOT ASSESSED. Two states would make an unconfirmed fact look like a rejected one.'
  - field: confirmed_at
    type: datetime|null
    required: false
    why: C1 requires summarising back and inviting correction. The time of confirmation is what makes
      a later contradiction datable.
  - field: conflicts_with
    type: FactId[]
    required: true
    why: A contradiction is CARRIED, never resolved silently. Both facts stay.
  - field: superseded_by
    type: FactId|null
    required: true
    why: A correction supersedes; it does not overwrite. The original stays readable.
- name: Engagement
  owner: B5
  purpose: Who the client is, who may instruct, what is in scope, and whether advice is reliance-ready.
  fields:
  - field: client
    type: PartyRef
    required: true
    why: The person or entity to whom the duty is owed.
  - field: client_kind
    type: enum {individual, company, firm, trust, society, government}
    required: true
    why: Authority to instruct is established differently for each.
  - field: intermediary
    type: PartyRef|null
    required: true
    why: '**B5 forbids treating an intermediary as the client.** A single `client` field with nowhere
      to put the intermediary is how the substitution happens.'
  - field: payer
    type: PartyRef|null
    required: true
    why: The payer is not the client. Same reasoning, and it recurs most often in family and insurance
      matters.
  - field: decision_maker
    type: PartyRef
    required: true
    why: Who decides, as distinct from who instructs and who pays.
  - field: may_instruct
    type: PartyRef[]
    required: true
    why: The closed set. An instruction from outside it is not an instruction.
  - field: scope
    type: string[]
    required: true
    why: What the engagement covers.
  - field: exclusions
    type: string[]
    required: true
    why: What it expressly does not.
  - field: scope_exceptions
    type: '{step, accepted_by, at}[]'
    required: true
    why: '**B5 permits out-of-scope work that is EXPRESSLY ACCEPTED.** With no field for the acceptance,
      the only representable outcomes are "in scope" and "blocked", and the acceptance happens off the
      record.'
  - field: confidentiality
    type: string
    required: true
    why: Recorded terms, not assumed ones.
  - field: communications
    type: string
    required: true
    why: How and with whom NM and the advocate may communicate.
  - field: fees
    type: string
    required: true
    why: B5 requires fees to be recorded. Absent, every proportionality assessment in E3 is unanchored.
  - field: disbursements
    type: string
    required: true
    why: Likely disbursements, separately — they are the ones that surprise clients.
  - field: custody
    type: string
    required: true
    why: Document custody. H2 cannot close a matter without it.
  - field: termination
    type: string
    required: true
    why: Termination rights, both ways.
  - field: complaints_route
    type: string
    required: true
    why: Required by B5 and never derivable later.
  - field: reliance
    type: enum {ready, not_ready, not_assessed}
    required: true
    why: '**THREE states, not a bool.** `reliance_ready: false` cannot distinguish "we checked and it
      is not" from "nobody looked", and B5 forbids marking advice reliance-ready while identity, authority,
      scope or decision ownership is unrecorded.'
  - field: reliance_blockers
    type: string[]
    required: true
    why: What specifically blocks reliance. A bare `not_ready` is a refusal with no route out.
  - field: authorities
    type: DecisionRecordId[]
    required: true
    why: The standing authorities given under this engagement, so G3 can invalidate them on a change of
      decision-maker.
- name: EvidenceItem
  owner: C7
  purpose: One item of evidence, with existence, admissibility and weight kept apart.
  fields:
  - field: what
    type: string
    required: true
    why: The item.
  - field: fact
    type: FactId[]
    required: true
    why: What it is capable of proving. An item proving nothing on the file is not evidence, it is paper.
  - field: holder
    type: enum {client, opponent, third_party, court, unknown}
    required: true
    why: Who has it decides how it is obtained and how long that takes.
  - field: form
    type: enum {original, certified_copy, photocopy, electronic, oral}
    required: true
    why: '**A photocopy is not the document.** One `form` string that does not distinguish them makes
      the s.65 secondary-evidence position invisible.'
  - field: existence
    type: enum {held, obtainable, absent, not_assessed}
    required: true
    why: C7 requires existence, admissibility and weight to be THREE questions. This is the first.
  - field: admissibility
    type: enum {admissible_as_held, needs, inadmissible, not_assessed}
    required: true
    why: The second. **Having a thing is not being able to prove it** — a WhatsApp exchange exists; whether
      it goes in depends on the electronic-records certificate.
  - field: admissibility_needs
    type: string[]
    required: true
    why: What would make it admissible. `needs` with nothing named is a dead end.
  - field: weight
    type: enum {strong, moderate, weak, not_assessed}
    required: true
    why: '**The third, and it was missing entirely from the original contract.** Admissible and persuasive
      are different questions, and an advocate plans differently for each.'
  - field: weight_reason
    type: string|null
    required: true
    why: Weight without a reason cannot be argued or challenged.
  - field: authenticity
    type: enum {established, disputed, not_assessed}
    required: true
    why: C7 requires authenticity to be inventoried. Disputed authenticity changes the proof sequence.
  - field: completeness
    type: enum {complete, partial, not_assessed}
    required: true
    why: A partial document read as whole is how a clause that kills the case stays unread.
  - field: metadata
    type: string|null
    required: true
    why: For electronic material, the metadata position is often the whole admissibility question.
  - field: custody
    type: '{holder, from, to}[]'
    required: true
    why: The chain. A break is an attack the opponent will make and we should make first.
  - field: preservation
    type: '{owner, due, issued_at|null}'
    required: true
    why: C7 requires a preservation instruction WITH A NAMED OWNER AND A DATE. An instruction with neither
      is a wish.
  - field: lawful_source
    type: bool
    required: true
    why: C7 forbids obtaining material unlawfully or suggesting a route that would. Without the field,
      nothing records that the question was asked.
- name: DecisionRecord
  owner: E4
  purpose: A client decision, and the explanation it rests on.
  fields:
  - field: decided_by
    type: PartyRef
    required: true
    why: The client decides; the advocate recommends. E4 turns on keeping those apart.
  - field: capacity
    type: CapacityPosition
    required: true
    why: B6. Any decision that becomes authority carries a capacity position.
  - field: options_explained
    type: string[]
    required: true
    why: The material alternatives, as put.
  - field: risks_explained
    type: string[]
    required: true
    why: The risks, as put.
  - field: uncertainty_explained
    type: string
    required: true
    why: '**E4 requires uncertainty to be explained and the original contract had nowhere to record it.**
      An option list with the uncertainty stripped out reads as a menu of certainties.'
  - field: consequences_explained
    type: string
    required: true
    why: Likewise consequences.
  - field: cost_explained
    type: string
    required: true
    why: Likewise cost.
  - field: irreversibility_explained
    type: string
    required: true
    why: Likewise irreversibility — the one a client most often has not considered.
  - field: plain_language_confirmed
    type: bool
    required: true
    why: E4 requires understanding to be CHECKED, not assumed from delivery.
  - field: instruction
    type: string
    required: true
    why: What was actually instructed.
  - field: scope
    type: '{matter, threads[], steps[]}'
    required: true
    why: '**E4 forbids an authority for one matter authorising a step on another.** A scope without thread
      and step granularity cannot refuse that.'
  - field: effective_from
    type: datetime
    required: true
    why: '**E4 forbids a future-dated authority authorising immediately.** With no effective date the
      rule is unrepresentable, let alone enforceable.'
  - field: expires_at
    type: datetime|null
    required: true
    why: A standing authority with no end is a standing risk.
  - field: voluntariness
    type: enum {free, pressured, not_assessed}
    required: true
    why: '**E4: a decision recorded under coercion is not authority.** Two states would force every unexamined
      decision into `free`.'
  - field: confirmed_at
    type: datetime
    required: true
    why: When.
  - field: confirmation_evidence
    type: string
    required: true
    why: How it was confirmed — the thing that makes the record evidence rather than a note.
  - field: superseded_by
    type: DecisionRecordId|null
    required: true
    why: Authority is withdrawn by a later record, never by deletion.
- name: FilingRecord
  owner: F4
  purpose: A filing, its approval, and the deadlines it creates.
  fields:
  - field: approved_by
    type: DecisionRecordId
    required: true
    why: F4 forbids completing a filing without approval.
  - field: approval_at
    type: datetime
    required: true
    why: Approval before filing, demonstrably.
  - field: authority_recheck
    type: '{at, findings[], outcome ∈ {clean, changed, not_run}}'
    required: true
    why: '**Tenet 31: every authority relied on is re-checked IMMEDIATELY BEFORE FILING.** The original
      contract had no field for it, so the rule could be stated, believed and never evidenced. `not_run`
      is a state because a recheck that could not run must not read as clean.'
  - field: filed_at
    type: datetime|null
    required: true
    why: '`null` until filed. F4 forbids recording a filing complete without proof.'
  - field: forum
    type: string
    required: true
    why: Which court. Consequential deadlines differ.
  - field: fee
    type: '{amount, receipt|null}'
    required: true
    why: A fee paid without a receipt is a fee that will be disputed.
  - field: service
    type: '{mode, on[], proof|null, served_at|null}'
    required: true
    why: F4 requires proof of service before completion.
  - field: limitation
    type: '{article: FindingId, computed_date, complied: bool}'
    required: true
    why: The filing either was or was not within the window, and the Article it was computed from must
      be readable back. A filing record that cannot answer that is the one you need most in an appeal.
  - field: consequential_deadlines
    type: DeadlineId[]
    required: true
    why: Filing creates deadlines. Unrecorded, they are missed.
  - field: complete
    type: bool
    required: true
    why: 'Derived, never asserted: approval AND proof of filing AND proof of service.'
  - field: incomplete_because
    type: string[]
    required: true
    why: 'What is missing. A bare `complete: false` gives the advocate nothing to do.'
- name: CaseSummary
  owner: A2 · G3
  purpose: THE FILE. Complete enough that another advocate can take it over from this alone.
  fields:
  - field: matter
    type: MatterId
    required: true
    why: Which file.
  - field: engagement
    type: Engagement
    required: true
    why: Who the client is and what is in scope. A handover without it hands over work with no authority
      to do it.
  - field: screens
    type: '{conflict, competence, scope, capacity, urgency}'
    required: true
    why: '**Each carries its own state, including `not_run`.** A2 forbids showing a `not_assessed` screen
      as clear, and that is only possible if the summary distinguishes them.'
  - field: threads
    type: Thread[]
    required: true
    why: Every dispute on the file, including deferred ones.
  - field: posture
    type: '{thread: Posture}'
    required: true
    why: Per thread, never per matter. Two disputes on one file can have opposite postures.
  - field: chronology
    type: '{thread: FactId[]}'
    required: true
    why: Per thread, ordered, with certainty and provenance on each.
  - field: issues
    type: Issue[]
    required: true
    why: Including `parked` ones — D9 has no delete path.
  - field: theory
    type: '{thread: Theory}'
    required: true
    why: The spine the issues hang off.
  - field: proof
    type: ProofPosition[]
    required: true
    why: Element, burden, standard, status.
  - field: authorities
    type: Finding[]
    required: true
    why: With binding status, validity window, paragraph kind and treatment. G3 must be able to invalidate
      them.
  - field: deadlines
    type: Deadline[]
    required: true
    why: Every one, passed included. A2 forbids dropping a passed deadline or filing it under upcoming.
  - field: decisions
    type: DecisionRecord[]
    required: true
    why: What the client decided and on what explanation.
  - field: reservations
    type: Reservation[]
    required: true
    why: E5. A disagreement the advocate overruled stays visible and reactivates on a changed fact.
  - field: gaps
    type: '{gap, blocks, owner}[]'
    required: true
    why: What is not established. A summary that shows only what IS known reads as complete.
  - field: handover_complete
    type: bool
    required: true
    why: Derived. G3 requires the summary to stand alone, and the claim must be computed rather than assumed.
  - field: handover_blockers
    type: string[]
    required: true
    why: What stops it standing alone — the list a receiving advocate reads first.
- name: ClosureRecord
  owner: H2
  purpose: The end of a matter, and everything that must not be open at it.
  fields:
  - field: matter
    type: MatterId
    required: true
    why: Which file.
  - field: closed_by
    type: PartyRef
    required: true
    why: Closure is a decision, and it has an author.
  - field: closed_at
    type: datetime|null
    required: true
    why: '`null` while blocked. H2 forbids closing over an open obligation.'
  - field: money
    type: '{client_funds, costs, disbursements, balance, returned_to, proof}'
    required: true
    why: H2 requires money to be ACCOUNTED FOR. A closure record with no money fields cannot refuse a
      closure with client funds outstanding.
  - field: originals
    type: '{what, returned_to, at, proof}[]'
    required: true
    why: Original documents are the most commonly stranded asset at closure.
  - field: work_product
    type: '{exported_at, format, location}'
    required: true
    why: H2 requires the usable file to be exported, not merely offered.
  - field: continuing_obligations
    type: '{what, until, owner}[]'
    required: true
    why: Obligations that outlive the matter. Unrecorded, they are breached by absence.
  - field: retention
    type: '{class, destroy_after, applied_at|null}'
    required: true
    why: Retention and destruction rules, applied and dated.
  - field: closure_summary_sent_at
    type: datetime|null
    required: true
    why: The client is told the matter closed. Silence is not closure.
  - field: lessons
    type: '{text, client_identifiers_removed: bool}'
    required: true
    why: '**H2 forbids client-identifying material in a lessons record.** A free-text lessons field with
      no such flag is where the leak happens.'
  - field: blockers
    type: string[]
    required: true
    why: 'What is still open: a deadline, an asset, an original, a fund, a retention obligation. Non-empty
      means closure is refused.'
- name: WitnessPlan
  owner: F5
  purpose: One witness, why they are called, and what protects their independence.
  fields:
  - field: thread
    type: ThreadId
    required: true
    why: Which dispute.
  - field: witness
    type: PartyRef
    required: true
    why: Who.
  - field: necessity
    type: string
    required: true
    why: Why this witness at all. F5 requires necessity to be assessed, not assumed from availability.
  - field: materiality
    type: FactId[]
    required: true
    why: Which facts they carry. A witness carrying no pleaded fact is a risk with no upside.
  - field: availability
    type: enum {confirmed, expected, doubtful, not_assessed}
    required: true
    why: A material witness who cannot attend changes the proof sequence, and finding out late is the
      whole problem.
  - field: credibility
    type: '{risks[], assessed_by}'
    required: true
    why: Assessed before the opponent does it for us.
  - field: interest
    type: string
    required: true
    why: Their interest in the outcome. It will be put to them.
  - field: prior_statements
    type: '{where, when, gist}[]'
    required: true
    why: Every prior statement is cross-examination material.
  - field: contradictions
    type: '{with_fact, nature}[]'
    required: true
    why: Known contradictions, surfaced rather than discovered in the box.
  - field: proof_sequence
    type: int
    required: true
    why: Order of examination. Sequence is strategy, not administration.
  - field: summons
    type: '{needed: bool, filed_at|null}'
    required: true
    why: A summons needed and not filed is a missed hearing.
  - field: interpreter
    type: '{language, arranged_by}|null'
    required: true
    why: Language requirements are a competence issue (B4) as well as a logistics one.
  - field: safety
    type: string|null
    required: true
    why: Where a witness is at risk, that governs everything else.
  - field: logistics_owner
    type: PartyRef
    required: true
    why: F5 requires a NAMED owner. Unowned logistics fail on the day.
  - field: contact_log
    type: '{when, by, purpose, present[]}[]'
    required: true
    why: '**F5 forbids coaching and requires independent recollection to be preserved.** The log is what
      makes that auditable rather than asserted — and it is the record that protects the advocate if it
      is alleged.'
- name: ExpertInstruction
  owner: F5
  purpose: An expert, instructed independently and testably.
  fields:
  - field: thread
    type: ThreadId
    required: true
    why: Which dispute.
  - field: expert
    type: PartyRef
    required: true
    why: Who.
  - field: discipline
    type: string
    required: true
    why: The field, and therefore the limits of what they may speak to.
  - field: purpose
    type: string
    required: true
    why: The question put. An expert asked a leading question produces a leading answer.
  - field: material_supplied
    type: string[]
    required: true
    why: F5 requires a COMPLETE material set.
  - field: material_withheld
    type: '{what, reason}[]'
    required: true
    why: Anything not supplied, with the reason. This is the field the opponent will probe, and an empty
      one is an answer.
  - field: assumptions
    type: string[]
    required: true
    why: Explicit assumptions. An unstated assumption is an opinion resting on air.
  - field: instruction_balanced
    type: bool
    required: true
    why: F5 forbids a partisan instruction.
  - field: independence_statement
    type: string
    required: true
    why: Recorded, not implied.
  - field: methodology_tested
    type: enum {tested, untested, not_assessed}
    required: true
    why: F5 requires methodology to be TESTED. Untested and untestable are different positions.
  - field: limitations
    type: string[]
    required: true
    why: What the opinion cannot support.
  - field: conflicts
    type: '{declared[], assessed_by}'
    required: true
    why: An expert conflict surfaces in cross-examination if it does not surface here.
  - field: report
    type: '{received_at, conclusions[]}|null'
    required: true
    why: '`null` until received.'
- name: DrafterBrief
  owner: F2
  purpose: The complete, lossless, structured hand-off to the drafting agent.
  fields:
  - field: cause_title
    type: '{court, parties[], numbers{}}'
    required: true
    why: The cause-title facts, so the drafter never re-derives them.
  - field: theory_sentence
    type: string
    required: true
    why: One sentence. A brief without a theory produces a pleading that is a list.
  - field: material_facts
    type: '{fact: FactId, date, provenance, weight}[]'
    required: true
    why: In date order, with provenance. **F2 forbids re-extraction — that is where facts get invented.**
  - field: provisions
    type: '{finding: FindingId, verbatim_span, locator, binding}[]'
    required: true
    why: With the span and the locator, so no lookup is repeated downstream.
  - field: limitation
    type: '{article: FindingId, computed_date, compliance_plea}'
    required: true
    why: The Article, the computed date and the plea. A pleading that does not plead compliance invites
      the demurrer.
  - field: reliefs
    type: string[] (ranked)
    required: true
    why: '**Ranked.** An unranked relief list is a drafter''s guess about what matters.'
  - field: authorities
    type: '{finding: FindingId, binding, treatment, scope}[]'
    required: true
    why: With binding status AND treatment scope — a case overruled on one point is good law on another.
  - field: proof_positions
    type: ProofPosition[]
    required: true
    why: Per element, so the pleading pleads what can be proved.
  - field: facts_not_to_plead
    type: '{fact: FactId, reason}[]'
    required: true
    why: '**F2 forbids omitting this.** Advocates plead selectively; an omission is a decision, and a
      drafter not told what was excluded will helpfully restore it.'
  - field: arguments_parked
    type: '{argument, reason}[]'
    required: true
    why: Same reasoning, for arguments.
  - field: open_gaps
    type: '{gap, blocks}[]'
    required: true
    why: What is unresolved. F3 turns these into marked blanks rather than confident prose.
  - field: blanks_permitted
    type: bool
    required: true
    why: A file with open gaps produces a draft WITH blanks. A draft without them, from a file with gaps,
      is the defect.
  - field: lossless
    type: bool
    required: true
    why: 'Derived: can a compliant pleading be drafted from this brief ALONE? **If not, the brief is the
      defect** — not the drafter.'
